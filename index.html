<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zoomaid</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f8fa; --panel2:#eaeef2; --border:#d0d7de;
    --fg:#1f2328; --muted:#656d76; --accent:#0969da; --accent-fg:#ffffff;
    --danger:#cf222e; --shadow:0 1px 3px rgba(31,35,40,.12),0 8px 24px rgba(66,74,83,.12);
    --stage:#ffffff;
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --panel:#161b22; --panel2:#21262d; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --accent-fg:#ffffff;
    --danger:#f85149; --shadow:0 1px 3px rgba(1,4,9,.5),0 8px 24px rgba(1,4,9,.5);
    --stage:#0d1117;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Meiryo,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header ---------- */
  .bar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);
    user-select:none; position:relative; z-index:20;
  }
  .brand{font-weight:600; letter-spacing:.2px; margin-right:4px; white-space:nowrap}
  .brand span{color:var(--muted); font-weight:400; margin-left:6px; font-size:11px}
  .spacer{flex:1 1 auto}
  button, .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg); color:var(--fg);
    padding:5px 11px; border-radius:6px; font:inherit; font-size:12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    transition:background .12s, border-color .12s;
  }
  button:hover{background:var(--panel2)}
  button:active{transform:translateY(.5px)}
  button.primary{background:var(--accent); border-color:transparent; color:var(--accent-fg); font-weight:500}
  button.primary:hover{filter:brightness(1.08)}
  button.on{background:var(--panel2); border-color:var(--accent)}
  button.icon{padding:5px 8px}
  kbd{
    font:inherit; font-size:10px; padding:1px 5px; border:1px solid var(--border);
    border-bottom-width:2px; border-radius:4px; background:var(--bg); color:var(--muted);
  }

  .pager{display:flex; align-items:center; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:2px}
  .pager button{border:0; padding:3px 7px; background:transparent}
  .pager .count{font-size:11px; color:var(--muted); padding:0 4px; font-variant-numeric:tabular-nums}

  /* ---------- settings popover ---------- */
  .pop{position:relative}
  .menu{
    position:absolute; right:0; top:calc(100% + 6px); min-width:230px;
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:6px; z-index:30;
  }
  .menu h4{margin:8px 8px 4px; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); font-weight:600}
  .seg{display:flex; gap:4px; padding:2px 6px 8px}
  .seg button{flex:1; justify-content:center; font-size:11.5px; padding:4px 6px}

  /* ---------- main ---------- */
  main{flex:1 1 auto; display:flex; min-height:0; position:relative}

  #editorPane{
    flex:0 0 auto; width:380px; min-width:220px; max-width:70vw;
    display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--border);
  }
  #editorPane[hidden]{display:none}
  #editorPane .head{padding:7px 12px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px}
  #code{
    flex:1 1 auto; width:100%; border:0; outline:0; resize:none; padding:12px;
    background:transparent; color:var(--fg); tab-size:2;
    font:12px/1.65 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  #split{flex:0 0 auto; width:5px; margin-left:-3px; cursor:col-resize; z-index:10; background:transparent}
  #split:hover{background:var(--accent); opacity:.35}

  #stage{
    flex:1 1 auto; position:relative; overflow:hidden; background:var(--stage);
    touch-action:none; cursor:grab; min-width:0;
  }
  #stage.grabbing{cursor:grabbing}
  #canvas{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
  #canvas svg{display:block; max-width:none !important; height:auto}

  /* ---------- overlays ---------- */
  #empty{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; text-align:center; color:var(--muted); padding:24px;
  }
  #empty .big{font-size:15px; color:var(--fg); font-weight:600}
  #empty .hint{font-size:12px; line-height:2}
  #empty[hidden]{display:none}

  #error{
    position:absolute; left:16px; right:16px; bottom:16px; max-height:45%; overflow:auto;
    background:var(--panel); border:1px solid var(--danger); border-radius:8px; padding:12px 14px;
    box-shadow:var(--shadow); z-index:15;
  }
  #error[hidden]{display:none}
  #error .t{color:var(--danger); font-weight:600; margin-bottom:6px; font-size:12px}
  #error pre{margin:0; white-space:pre-wrap; word-break:break-word; font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace; color:var(--fg)}

  #zoombar{
    position:absolute; right:14px; bottom:14px; display:flex; align-items:center; gap:2px;
    background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px;
    box-shadow:var(--shadow); z-index:12; user-select:none;
  }
  #zoombar button{border:0; background:transparent; padding:4px 8px}
  #zoombar .pct{
    min-width:52px; text-align:center; font-size:11.5px; color:var(--muted);
    font-variant-numeric:tabular-nums; cursor:pointer; padding:4px 2px; border-radius:4px;
  }
  #zoombar .pct:hover{background:var(--panel2); color:var(--fg)}
  .sep{width:1px; height:18px; background:var(--border); margin:0 3px}

  #toast{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
    background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:20px; font-size:12px;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:40; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  #drop{
    position:absolute; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    border:2px dashed var(--accent); font-size:14px; color:var(--accent); font-weight:600;
  }
  body.dragging #drop{display:flex}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Zoomaid<span id="ver"></span></div>

  <div class="pager" id="pager" hidden>
    <button id="prevBlock" title="前の図">‹</button>
    <span class="count" id="blockCount">1/1</span>
    <button id="nextBlock" title="次の図">›</button>
  </div>

  <div class="spacer"></div>

  <button id="btnClear" title="表示中の図を消して初期状態に戻す (C)">クリア</button>
  <button id="btnEditor" class="icon" title="コードを編集 (E)">&lt;/&gt;</button>
  <button id="btnTheme" class="icon" title="テーマ切り替え (T)">◐</button>

  <div class="pop">
    <button id="btnGear" class="icon" title="設定">⚙</button>
    <div class="menu" id="menu" hidden>
      <h4>ホイール / 2本指スワイプ</h4>
      <div class="seg" data-group="wheel">
        <button data-val="pan">パン</button>
        <button data-val="zoom">ズーム</button>
      </div>
      <h4>PNG 背景</h4>
      <div class="seg" data-group="pngbg">
        <button data-val="theme">テーマ色</button>
        <button data-val="white">白</button>
        <button data-val="none">透過</button>
      </div>
      <h4>PNG 解像度</h4>
      <div class="seg" data-group="pngscale">
        <button data-val="2">2x</button>
        <button data-val="3">3x</button>
        <button data-val="4">4x</button>
      </div>
    </div>
  </div>

  <button id="btnPng" class="primary" title="PNGで保存 (S)">PNG保存</button>
</header>

<main>
  <aside id="editorPane" hidden>
    <div class="head">Mermaid コード<span class="spacer"></span><kbd>Esc</kbd></div>
    <textarea id="code" spellcheck="false" placeholder="graph TD&#10;  A --> B"></textarea>
  </aside>
  <div id="split" hidden></div>

  <div id="stage">
    <div id="canvas"></div>

    <div id="empty">
      <div class="big">Mermaid のコードを貼り付けてください</div>
      <div class="hint">
        <kbd>⌘V</kbd> / <kbd>Ctrl+V</kbd> で貼り付け &nbsp;·&nbsp; .md / .mmd をドラッグ&ドロップ<br>
        ```mermaid で囲まれた Markdown をそのまま貼っても認識します<br>
        ターミナルからは <kbd>zoomaid</kbd> コマンドでも開けます
      </div>
      <button id="btnRead">クリップボードから読み込む</button>
    </div>

    <div id="error" hidden><div class="t">レンダリングエラー</div><pre id="errorMsg"></pre></div>

    <div id="zoombar">
      <button id="zoomOut" title="縮小 (−)">−</button>
      <div class="pct" id="pct" title="クリックで100%">100%</div>
      <button id="zoomIn" title="拡大 (+)">＋</button>
      <div class="sep"></div>
      <button id="btnFit" title="全体表示 (F / 0)">⛶</button>
    </div>

    <div id="toast"></div>
    <div id="drop">ドロップして読み込む</div>
  </div>
</main>

<script src="./vendor/mermaid.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
